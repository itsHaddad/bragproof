name: measure
# Reads a seeded random sample of public agent sessions with the engine and uploads the counts and a draw of
# findings for reading by hand. The numbers on the method page come from a run of this job.
on:
  # A push that changes scripts/measure.run starts a run (a new workflow cannot be started by hand until it is on
  # the default branch).
  push:
    paths: [scripts/measure.run]
  workflow_dispatch:
    inputs:
      size:
        description: How many sessions to draw
        default: "300"
      seed:
        description: Seed for the draw
        default: bragproof-2026-11-18
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun scripts/measure.ts "$SIZE" "$SEED" measurement
        env:
          SIZE: ${{ inputs.size || '300' }}
          SEED: ${{ inputs.seed || 'bragproof-2026-11-18' }}
      - uses: actions/upload-artifact@v4
        with:
          name: measurement
          path: measurement
          retention-days: 30
