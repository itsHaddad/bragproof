name: check
# Runs one bragproof check on a GitHub-hosted machine and produces a receipt that GitHub has witnessed.
#
# Call it from any repository:
#
#   jobs:
#     prove:
#       permissions: { id-token: write, contents: read }
#       uses: itsHaddad/bragproof/.github/workflows/check.yml@check-v1
#       with:
#         spec_b64: <your spec file, base64>
#
# What makes the receipt worth something: the token GitHub signs names THIS file and the commit it was read
# from, and this file starts one runner image, pinned by digest, and nothing else. The caller supplies the
# spec only. Rule for this file: no `uses:` steps at all, and nothing that is not fixed by the commit, because
# every step of this job could ask GitHub for a token.
#
# The receipt names the calling repository, its owner, the commit and the run. Do not call this from a private
# repository if those must stay private.
on:
  workflow_call:
    inputs:
      spec_b64:
        description: The check spec (JSON), base64 encoded.
        required: true
        type: string
      feed:
        description: A feed (https) to publish the receipt to. Empty for none.
        required: false
        type: string
        default: ""
    outputs:
      receipt_b64:
        description: The receipt (JSON), base64 encoded. Empty when the run produced none.
        value: ${{ jobs.run.outputs.receipt_b64 }}
permissions:
  id-token: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      receipt_b64: ${{ steps.run.outputs.receipt_b64 }}
    env:
      # The runner image, by digest. Changing this line changes which commits of this file verifiers accept.
      RUNNER_IMAGE: ghcr.io/itshaddad/bragproof-runner@sha256:7d4f76cbe14e2d201658d52131c663ab8d3701b4bb03dd5a22e21890e2a239f5
      CHECK_SPEC_B64: ${{ inputs.spec_b64 }}
      FEED_URL: ${{ inputs.feed }}
      BRAGPROOF_REQUIRE_EVIDENCE: "1"
    steps:
      - name: Run the check in the pinned runner
        id: run
        run: |
          set -o pipefail
          status=0
          docker run --rm --security-opt no-new-privileges \
            -e CHECK_SPEC_B64 -e FEED_URL -e BRAGPROOF_REQUIRE_EVIDENCE \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            "$RUNNER_IMAGE" > run.out || status=$?
          receipt=$(grep -o '^BRAGPROOF-RECEIPT:[A-Za-z0-9+/=]*$' run.out | tail -1 | cut -d: -f2)
          echo "receipt_b64=$receipt" >> "$GITHUB_OUTPUT"
          if [ -n "$receipt" ]; then echo "$receipt" | base64 -d | head -c 600; echo; else echo "no receipt"; fi
          exit $status
