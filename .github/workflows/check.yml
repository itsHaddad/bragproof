name: check
# Lint, types, build and tests on every push and pull request.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: the command line gives the same report id as the page for the example
        run: |
          id=$(bun src/cli.ts dist/example-session.jsonl --json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).id)')
          grep -q "$id" dist/index.html
          echo "report id $id is on the page"
