name: seed
# Runs every spec in specs/ through the check workflow and publishes the receipts to a feed.
on:
  workflow_dispatch:
    inputs:
      feed:
        description: Feed to publish to (https)
        required: false
        default: ""
      only:
        description: Run only the spec with this file name (without .json)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          specs=$(for f in specs/*.json; do
            name=$(basename "$f" .json)
            if [ -n "$ONLY" ] && [ "$name" != "$ONLY" ]; then continue; fi
            jq -n --arg name "$name" --arg spec "$(base64 -w0 "$f")" '{name: $name, spec_b64: $spec}'
          done | jq -sc .)
          [ "$specs" != "[]" ] || { echo "no spec matches"; exit 1; }
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
  check:
    needs: list
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        spec: ${{ fromJson(needs.list.outputs.specs) }}
    name: ${{ matrix.spec.name }}
    uses: itsHaddad/bragproof/.github/workflows/check.yml@check-v1
    with:
      spec_b64: ${{ matrix.spec.spec_b64 }}
      feed: ${{ inputs.feed }}
