name: probe
# Lists the tools of candidate packages (tools/candidates.json), each started in the runner's jail on a
# throwaway machine. Nothing is called and no receipt is made: the output is raw material for writing specs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          image=$(grep -o 'ghcr.io/itshaddad/bragproof-runner@sha256:[0-9a-f]*' .github/workflows/check.yml | head -1)
          i=0
          jq -r '.[]' tools/candidates.json | while read -r pkg; do
            i=$((i+1))
            [ $((i % 8)) = "$SHARD" ] || continue
            echo "== $pkg"
            timeout 150 docker run --rm --security-opt no-new-privileges --memory 2g --entrypoint bun "$image" src/cli/main.ts probe "$pkg" 2>/dev/null | grep '^BRAGPROOF-PROBE:' | cut -d: -f2- >> probes.jsonl || echo "{\"package\":\"$pkg\",\"ok\":false,\"error\":\"timed out or crashed\"}" >> probes.jsonl
          done
          wc -l probes.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probes-${{ matrix.shard }}
          path: probes.jsonl
